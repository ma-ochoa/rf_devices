name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.14 .venv
      - run: uv pip install -p .venv/bin/python pytest-homeassistant-custom-component broadlink==0.19.0 ruff
      - run: .venv/bin/ruff check custom_components tests --select E,F,W,I,B,UP --ignore E501
      - run: .venv/bin/pytest -q
